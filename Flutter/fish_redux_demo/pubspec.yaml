name: fish_redux_demo
description: A new Flutter application.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # GitHub leftcoding/fish-redux null safety fork，SDK 约束已兼容 Dart 3
  fish_redux:
    git:
      url: https://github.com/leftcoding/fish-redux.git
  dio: ^5.4.0    #网络请求框架
  json_annotation: ^4.9.0 # json序列化和反序列化用的

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
